[project]
name = "access-control-analyzer"
version = "0.1.0"
description = "Audit utility for analyzing synthetic access-control cardholder exports"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Edward King", email = "king8three@gmail.com" }
]
keywords = ["access-control", "audit", "physical-security", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "streamlit>=1.60.0",
]

[project.urls]
Homepage = "https://github.com/nextking12/acs-analyzer"
Repository = "https://github.com/nextking12/acs-analyzer"
Issues = "https://github.com/nextking12/acs-analyzer/issues"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
